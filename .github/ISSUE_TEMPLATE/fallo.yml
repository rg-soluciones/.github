name: Fallo
description: Algo que no funciona como debería
labels: ["fallo"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Lo que se ve, con el mensaje de error exacto si lo hay.
    validations: { required: true }
  - type: textarea
    id: pasos
    attributes:
      label: Cómo se reproduce
      placeholder: "1. Entrar en…\n2. Pulsar…\n3. Sale…"
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
  - type: input
    id: version
    attributes:
      label: Versión y entorno
      placeholder: "TPV 5.1.3 en Windows 10 · portal en producción · staging…"
